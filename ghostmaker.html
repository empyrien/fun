<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghostmaker · Dead Pixels</title>
<link rel="icon" type="image/png" href="/favicon.png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#272231">
<meta name="description" content="Assemble a Dead Pixels ghost from the real trait vault. The parts know the rules.">
<style>
  :root {
    color-scheme: dark;
    --led: #3BE8BC;
    --led-dim: rgba(59, 232, 188, 0.6);
    --ink: #F1EEF6;
    --ink-dim: rgba(241, 238, 246, 0.62);
    --ink-faint: rgba(241, 238, 246, 0.28);  /* decorative only — borders, glyphs */
    --card: rgba(255, 255, 255, 0.045);
    --card-edge: rgba(255, 255, 255, 0.11);
    --warn: #ffab84;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --gs: 7;                /* ghost pixel scale */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 0%, #2e2939 0%, #272231 52%, #211c2b 100%);
    color: var(--ink);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a.close { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left)); z-index: 30; color: rgba(241,238,246,0.5); text-decoration: none; font-size: 22px; font-weight: 300; line-height: 1; padding: 11px; }
  a.close:hover { color: var(--ink); }

  .wrap {
    max-width: 1080px; margin: 0 auto;
    padding: clamp(52px, 8vh, 92px) 28px 96px;
    display: flex; flex-direction: column; gap: clamp(36px, 5vh, 56px);
  }

  header { text-align: center; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink-dim); text-transform: uppercase; }
  .eyebrow .led { color: var(--led); }
  h1 { margin: 10px 0 0; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
  .tagline { margin: 10px 0 0; font-size: 15px; color: var(--ink-dim); line-height: 1.55; }

  /* ---------- the bench: ghost centered, part shelves either side ------- */
  .bench {
    position: relative;
    display: grid;
    /* the ghost track carries extra air on both sides of the canvas */
    /* rails stay symmetric so the ghost sits dead centre */
    grid-template-columns: minmax(190px, 1fr) 56px calc(47px * var(--gs) + 48px) 56px minmax(190px, 1fr);
    grid-auto-rows: 80px;
    column-gap: 22px;
    align-items: center;
    justify-items: center;
  }
  .r1 { grid-row: 1; } .r2 { grid-row: 2; } .r3 { grid-row: 3; } .r4 { grid-row: 4; }
  .r5 { grid-row: 5; } .r6 { grid-row: 6; } .r7 { grid-row: 7; } .r8 { grid-row: 8; }

  .ghostcol { grid-column: 3; grid-row: 1 / span 8; align-self: center; position: relative; z-index: 3; }
  .floatwrap { position: relative; width: calc(47px * var(--gs)); max-width: 100%; }
  .floater {
    position: relative; border-radius: 16px;
    box-shadow: 0 24px 48px -20px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .floater.is-flying #ghost { opacity: 0; }
  canvas#ghost {
    display: block; width: 100%; aspect-ratio: 1;
    image-rendering: crisp-edges; image-rendering: pixelated;
    border-radius: 16px;
  }
  .shadow {
    width: 40%; height: 12px; margin: 14px auto 0; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,0.32), transparent 70%);
  }

  /* circulation badge: is this exact trait combo already a minted ghost? */
  .mintbadge {
    margin: 12px auto 0; max-width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-align: center; font-family: var(--mono); text-transform: uppercase;
  }
  .mintbadge .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--led-dim); color: var(--led);
    background: rgba(59,232,188,0.07);
    font-size: 10.5px; letter-spacing: 0.12em; font-weight: 600;
  }
  .mintbadge .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .mintbadge.taken .pill { border-color: rgba(255,171,132,0.55); color: var(--warn); background: rgba(255,171,132,0.08); }
  .mintbadge .sub { font-size: 9px; letter-spacing: 0.1em; color: var(--ink-dim); }

  /* contest entry: post the build to X, gated by the badge above */
  .enter { margin: 14px auto 0; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .xpost {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 19px 10px 16px; border-radius: 999px; cursor: pointer;
    background: #000; color: #fff; border: 1px solid rgba(255, 255, 255, 0.24);
    font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    box-shadow: 0 12px 26px -14px rgba(0, 0, 0, 0.8);
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.25s ease, opacity 0.15s ease;
  }
  .xpost svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
  .xpost:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.6); transform: translateY(-1px); }
  .xpost:active:not(:disabled) { transform: scale(0.97); }
  .xpost:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--led-dim); }
  .xpost:disabled { opacity: 0.32; cursor: default; }
  .neon-builder .xpost:not(:disabled) { box-shadow: 0 12px 26px -14px rgba(0, 0, 0, 0.8), 0 0 22px rgba(140, 90, 255, 0.28); }
  .xhint {
    max-width: 36ch; text-align: center;
    font-family: var(--mono); font-size: 9px; line-height: 1.5; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim);
  }

  /* the attach step: X won't take an image from a website, so we hand it over */
  .attach-backdrop {
    position: fixed; inset: 0; z-index: 110;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(10, 8, 15, 0.72);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .attach-card {
    position: relative; width: min(580px, 100%);
    display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 22px; align-items: center;
    padding: 24px; border-radius: 18px;
    border: 1px solid var(--card-edge);
    background: radial-gradient(circle at 85% 5%, rgba(177, 140, 255, 0.12), transparent 40%), #2b2636;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
  }
  .neon-builder .attach-card { background: radial-gradient(circle at 85% 5%, rgba(25, 245, 255, 0.1), transparent 40%), #1c1828; }
  .attach-img {
    display: block; width: 176px; height: 176px; border-radius: 12px;
    image-rendering: crisp-edges; image-rendering: pixelated;
    background: rgba(0, 0, 0, 0.25);
    box-shadow: 0 16px 34px -18px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  .attach-body h2 { margin: 0 34px 8px 0; font-size: 19px; line-height: 1.2; font-weight: 600; }
  .attach-msg { margin: 0 0 16px; font-size: 14px; line-height: 1.55; color: var(--ink); }
  .attach-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .attach-actions button, .attach-actions a {
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none;
    background: none; color: var(--ink); border: 1px solid var(--card-edge);
    border-radius: 999px; padding: 9px 16px; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .attach-actions button:hover, .attach-actions a:hover { border-color: rgba(241, 238, 246, 0.45); }
  .attach-actions .primary { background: var(--ink); border-color: var(--ink); color: #272231; font-weight: 600; }
  .attach-actions .primary:hover { background: #fff; border-color: #fff; }
  .attach-actions button:focus-visible, .attach-actions a:focus-visible, .attach-close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--led-dim); }
  .attach-note {
    margin: 14px 0 0; font-family: var(--mono); font-size: 9px; line-height: 1.6;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim);
  }
  .attach-close {
    position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
    border: 1px solid var(--card-edge); border-radius: 50%;
    background: rgba(255, 255, 255, 0.05); color: var(--ink-dim);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .attach-close:hover { color: var(--ink); background: rgba(255, 255, 255, 0.1); }
  @media (max-width: 560px) {
    .attach-card { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 22px 18px; }
    .attach-body h2 { margin-right: 0; }
    .attach-actions { justify-content: center; }
  }
  .floater.pop { animation: pop 0.26s ease-out; }
  @keyframes pop { 0% { scale: 1; } 35% { scale: 1.03; } 100% { scale: 1; } }
  @media (prefers-reduced-motion: reduce) { .floater.pop { animation: none !important; } }

  /* row meta (left rail): trait name, current value, dice */
  .rowmeta {
    justify-self: stretch; width: 100%; text-align: right; min-width: 0;
    display: flex; align-items: center; justify-content: flex-end; gap: 5px;
    outline: none; border-radius: 10px; padding: 6px 2px 6px 6px;
  }
  .rowmeta .rowtext { margin-right: 3px; }
  .rowmeta:focus-visible { box-shadow: 0 0 0 2px var(--led-dim); }
  .rowtext { flex: 1 1 auto; min-width: 0; }
  .rowname { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; color: var(--ink-dim); text-transform: uppercase; margin-bottom: 3px; }
  .rowval {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-family: var(--mono); font-size: 12px; line-height: 1.25; letter-spacing: 0.05em; color: var(--led); text-transform: uppercase;
  }
  .dice, .browse, .revert {
    background: none; border: 1px solid var(--card-edge); border-radius: 9px;
    width: 28px; height: 28px; padding: 0;
    color: var(--ink-dim); font-size: 12px; line-height: 1; cursor: pointer; flex: none;
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.25s ease;
  }
  .dice:hover, .browse:hover, .revert:hover { color: var(--led); border-color: var(--led-dim); }
  .dice:active { transform: rotate(72deg); }
  .browse { font-size: 14px; }
  .browse:active { transform: scale(0.92); }
  .revert { font-size: 15px; }
  .revert:active { transform: rotate(-200deg); }

  /* minted count (right rail) */
  .rowcount { justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; color: var(--ink-dim); text-transform: uppercase; white-space: nowrap; }

  /* part shelves: click the previous / next layer to put it on the ghost */
  .chip {
    width: 56px; height: 56px; padding: 5px; cursor: pointer;
    background: var(--card);
    border: 1px solid var(--card-edge); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 20px -14px rgba(0, 0, 0, 0.5);
    transition: border-color 0.16s ease, transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    touch-action: pan-y;
  }
  .chip:hover { border-color: var(--led-dim); background: rgba(255,255,255,0.075); transform: translateY(-2px); box-shadow: 0 14px 24px -14px rgba(0,0,0,0.55); }
  .chip:active { transform: scale(0.94); }
  .chip:focus-visible { box-shadow: 0 0 0 2px var(--led-dim); outline: none; }
  .chip canvas { width: 44px; height: 44px; image-rendering: crisp-edges; image-rendering: pixelated; pointer-events: none; }
  .chip .none { color: var(--ink-faint); font-size: 18px; font-weight: 200; pointer-events: none; }
  .chip:disabled { opacity: 0.25; cursor: default; }
  .chip:disabled:hover { border-color: var(--card-edge); transform: none; background: var(--card); }

  /* Keep flights inside the floater so Neon uses the same glow/filter
     before, during, and after the layered animation. */
  #benchfx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .flight-layer {
    position: absolute; transform-origin: top left; border-radius: 16px;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }

  .log {
    min-height: 34px;
    display: flex; flex-direction: column; gap: 4px; align-items: center;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .log .line { color: var(--led); animation: fadeline 0.25s ease-out; }
  .log .line.warn { color: var(--warn); }
  .log .line.old { opacity: 0.35; }
  @keyframes fadeline { from { opacity: 0; transform: translateY(4px); } }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .actions button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    background: none; color: var(--ink); border: 1px solid var(--card-edge);
    border-radius: 999px; padding: 11px 22px; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .actions button:hover { border-color: rgba(241,238,246,0.4); }
  .actions button.primary { background: var(--ink); border-color: var(--ink); color: #272231; font-weight: 600; }
  .actions button.primary:hover { background: #ffffff; border-color: #ffffff; }
  .actions button:disabled { opacity: 0.35; cursor: default; }
  /* the room dims when the Neon lab is on, so the glow does the talking */
  body.neon-builder {
    background: radial-gradient(120% 90% at 50% 0%, #1c1828 0%, #14111d 52%, #0b0911 100%);
  }
  .neon-builder .chip, .neon-builder .dice, .neon-builder .browse, .neon-builder .revert { background: rgba(0, 0, 0, 0.22); border-color: rgba(255, 255, 255, 0.09); }
  .neon-builder .floater { box-shadow: 0 30px 60px -22px rgba(0, 0, 0, 0.85), 0 0 48px rgba(47, 239, 255, 0.12), inset 0 0 0 1px rgba(255,255,255,0.05); }
  .neon-builder .ghostcol { filter: drop-shadow(0 0 20px rgba(47, 239, 255, 0.2)); }
  .neon-builder .rowcount { color: rgba(80, 240, 255, 0.66); }
  .neon-loading .bench { opacity: 0.55; transition: opacity 0.18s ease; }

  /* ---------- classic ⇄ neon switch ---------------------------------------- */
  .modebar { display: flex; flex-direction: column; align-items: center; gap: 9px; margin-top: 24px; }
  .modeswitch {
    display: inline-flex; align-items: center; gap: 14px; padding: 9px 16px 9px 18px;
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 999px; cursor: pointer;
    background-origin: border-box; background-repeat: no-repeat;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim);
    transition: border-color 0.2s ease, box-shadow 0.3s ease, background 0.3s ease;
  }
  .modeswitch:hover { border-color: rgba(241,238,246,0.35); }
  .modeswitch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--led-dim); }
  .modeswitch:disabled { cursor: default; }
  .mode-label { transition: color 0.2s ease, text-shadow 0.3s ease; }
  .modeswitch:not(.on) .mode-classic { color: var(--ink); }
  .mode-track {
    position: relative; isolation: isolate; width: 48px; height: 26px; border-radius: 999px;
    background: rgba(255,255,255,0.08); border: 1px solid var(--card-edge);
    /* lay the gradient over the border box: by default it spans the padding
       box and repeats under the 1px border, so each end showed a sliver of
       the gradient's opposite colour */
    background-origin: border-box; background-repeat: no-repeat;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  /* the glow is a blurred copy of the track itself, so each half glows in
     its own colour instead of one colour haloing the whole pill */
  .mode-track::before {
    content: ""; position: absolute; inset: -1px; border-radius: 999px; z-index: -1;
    background: inherit; filter: blur(7px); opacity: 0;
    transition: opacity 0.3s ease;
  }
  .mode-knob {
    position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.3, 1.18), background 0.3s ease, box-shadow 0.3s ease;
  }
  .modeswitch.on {
    border-color: rgba(255, 255, 255, 0.2);
    background: linear-gradient(110deg, rgba(255, 40, 194, 0.10), rgba(25, 245, 255, 0.10)) 0 0 / 100% 100% no-repeat border-box;
    box-shadow: 0 0 30px rgba(140, 90, 255, 0.18);
  }
  /* origin/repeat ride inside the shorthand — a bare `background:` here would
     reset them and bring the wrapped-tile slivers back */
  .modeswitch.on .mode-track { background: linear-gradient(90deg, #ff2cc2, #19f5ff) 0 0 / 100% 100% no-repeat border-box; border-color: transparent; }
  .modeswitch.on .mode-track::before { opacity: 0.7; }
  .modeswitch.on .mode-knob { transform: translateX(22px); background: #fff; box-shadow: 0 0 10px #fff; }
  .modeswitch.on .mode-neon { color: #d5fdff; text-shadow: 0 0 10px rgba(25, 245, 255, 0.75); }
  .modeswitch.loading .mode-knob { animation: knobpulse 0.9s ease-in-out infinite; }
  @keyframes knobpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .modeswitch.error { border-color: rgba(255, 171, 132, 0.6); }
  .modeswitch.error .mode-neon { color: var(--warn); }
  .mode-status { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); min-height: 14px; }
  @media (prefers-reduced-motion: reduce) { .mode-knob { transition: none; } .modeswitch.loading .mode-knob { animation: none; } }

  /* ---------- mobile: ghost on top, shelf rows beneath ------------------ */
  @media (max-width: 1020px) {
    .dice, .browse, .revert { width: 34px; height: 34px; font-size: 13px; }
    :root { --gs: 6; }
    .wrap { padding-left: 20px; padding-right: 20px; }
    .bench {
      grid-template-columns: 56px minmax(0, 1fr) 56px;
      grid-template-rows: auto;      /* row 1 fits the ghost */
      grid-auto-rows: 70px;
      column-gap: 12px;
    }
    .ghostcol { grid-column: 1 / -1; grid-row: 1; padding-bottom: 30px; }
    .bench .r1 { grid-row: 2; } .bench .r2 { grid-row: 3; } .bench .r3 { grid-row: 4; } .bench .r4 { grid-row: 5; }
    .bench .r5 { grid-row: 6; } .bench .r6 { grid-row: 7; } .bench .r7 { grid-row: 8; } .bench .r8 { grid-row: 9; }
    .chip-prev { grid-column: 1; }
    .rowmeta { grid-column: 2; justify-self: stretch; justify-content: center; text-align: center; }
    .chip-next { grid-column: 3; }
    .rowcount { display: none; }
  }
  @media (min-width: 1021px) {
    .rowmeta { grid-column: 1; }
    .chip-prev { grid-column: 2; }
    .chip-next { grid-column: 4; }
    .rowcount { grid-column: 5; }
  }
  @media (max-width: 600px) {
    .bench { grid-auto-rows: 104px; }
    .ghostcol { min-width: 0; max-width: 100%; }
    .floatwrap { width: min(calc(47px * var(--gs)), calc(100vw - 40px)); }
    .rowmeta { flex-wrap: wrap; padding: 4px 0; }
    .rowmeta .rowtext { flex: 0 0 100%; margin-right: 0; }
    .dice, .browse, .revert { width: 36px; height: 36px; }
  }

  /* ---------- part browser (ported from /studio's trait picker) --------- */
  .picker-backdrop {
    position: fixed; inset: 0; z-index: 100;
    display: flex; justify-content: flex-end;
    background: rgba(10, 8, 15, 0.7);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .picker-sheet {
    width: min(680px, calc(100vw - 40px));
    height: 100vh; height: 100dvh;
    padding: 22px max(22px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) 22px;
    overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain;
    border-left: 1px solid var(--card-edge);
    background:
      radial-gradient(circle at 85% 5%, rgba(177, 140, 255, 0.12), transparent 34%),
      #2b2636;
    box-shadow: -28px 0 70px rgba(0,0,0,0.52);
  }
  .picker-head {
    position: sticky; top: -22px; z-index: 5;
    min-height: calc(62px + env(safe-area-inset-top)); margin: -22px -22px 16px;
    padding: calc(18px + env(safe-area-inset-top)) 22px 12px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(39, 34, 49, 0.94);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .picker-head .microlabel { display: block; font: 600 8px/1 var(--mono); letter-spacing: 0.12em; color: var(--ink-dim); text-transform: uppercase; }
  .picker-head h2 { margin: 4px 0 0; font-size: 22px; line-height: 1.1; font-weight: 600; }
  .picker-close {
    width: 44px; height: 44px; flex: none;
    border: 1px solid var(--card-edge); border-radius: 50%;
    background: rgba(255,255,255,0.05); color: var(--ink-dim);
    font-size: 22px; line-height: 1; cursor: pointer;
  }
  .picker-close:hover { background: rgba(255,255,255,0.1); color: var(--ink); }
  .picker-tools {
    position: sticky; top: calc(40px + env(safe-area-inset-top)); z-index: 4;
    margin: 0 -4px 14px; padding: 6px 4px 2px;
    background: linear-gradient(to bottom, rgba(43,38,54,0.98) 82%, rgba(43,38,54,0));
  }
  .gm-search-block {
    margin-bottom: 8px; padding: 10px;
    border: 1px solid rgba(59,232,188,0.22); border-radius: 12px;
    background: linear-gradient(135deg, rgba(59,232,188,0.055), rgba(177,140,255,0.045));
  }
  .trait-search > span { display: block; margin-bottom: 5px; color: var(--ink-dim); font: 600 8px/1 var(--mono); letter-spacing: 0.12em; }
  .trait-search input {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--card-edge); border-radius: 10px;
    background: rgba(0,0,0,0.14); color: var(--ink); font-size: 13px; outline: 0;
  }
  .trait-search input:focus { border-color: rgba(59,232,188,0.52); }
  .search-meta { min-height: 24px; margin-top: 6px; display: flex; align-items: center; gap: 7px; }
  .search-meta > span { flex: 1; color: var(--ink-dim); font: 650 8px/1.3 var(--mono); letter-spacing: 0.075em; text-transform: uppercase; }
  .search-meta button {
    flex: none; min-width: 44px; padding: 6px 9px;
    border: 1px solid rgba(255,255,255,0.09); border-radius: 999px;
    background: rgba(0,0,0,0.1); color: var(--ink-dim);
    font: 700 8px/1 var(--mono); letter-spacing: 0.07em; cursor: pointer;
  }
  .search-meta button:hover { border-color: rgba(59,232,188,0.42); color: var(--led); }
  .neon-skin-controls {
    display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 10px;
    border: 1px solid rgba(97,248,255,0.22); border-radius: 12px;
    background: linear-gradient(120deg, rgba(25,245,255,0.06), rgba(217,45,255,0.055));
  }
  .neon-skin-controls[hidden] { display: none; }
  .neon-choice { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .neon-choice > span { margin-right: 3px; color: var(--ink-dim); font: 650 8px/1 var(--mono); letter-spacing: 0.08em; }
  .neon-choice button {
    min-width: 38px; height: 34px; padding: 0 9px;
    border: 1px solid rgba(255,255,255,0.11); border-radius: 999px;
    background: rgba(0,0,0,0.13); color: var(--ink-dim);
    font: 700 8px/1 var(--mono); cursor: pointer;
  }
  .neon-choice button[aria-pressed="true"] { border-color: #61f8ff; background: rgba(25,245,255,0.13); color: #e4feff; }
  .trait-browser-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 7px; }
  .trait-browser-grid > button {
    min-width: 0; min-height: 108px; padding: 8px 5px;
    border: 1px solid rgba(255,255,255,0.09); border-radius: 10px;
    background: rgba(0,0,0,0.12); color: var(--ink-dim); cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .trait-browser-grid > button:hover { transform: translateY(-1px); border-color: rgba(59,232,188,0.38); background: rgba(59,232,188,0.07); color: var(--ink); }
  .trait-browser-grid > button.current { border-color: var(--led); background: rgba(59,232,188,0.1); }
  .trait-browser-grid > button.current::after { content: "SELECTED"; display: block; margin-top: 4px; color: var(--led); font: 700 7px/1 var(--mono); letter-spacing: 0.08em; }
  .trait-preview { width: 58px; height: 58px; margin: 0 auto 5px; display: grid; place-items: center; border-radius: 8px; background: rgba(255,255,255,0.03); }
  .trait-preview img, .trait-preview canvas { width: 56px; height: 56px; object-fit: contain; image-rendering: crisp-edges; image-rendering: pixelated; }
  .trait-preview .none { color: var(--ink-faint); font-size: 20px; font-weight: 200; }
  .trait-browser-grid strong, .trait-browser-grid small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trait-browser-grid strong { color: var(--ink); font-size: 9.5px; line-height: 1.25; font-weight: 600; }
  .trait-browser-grid small { margin-top: 2px; color: var(--ink-dim); font: 600 7px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
  .neon-skin-picker .trait-browser-grid { grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); }
  .neon-skin-picker .trait-browser-grid small { min-height: 2.4em; white-space: normal; }
  .picker-empty { min-height: 140px; display: flex; align-items: center; justify-content: center; color: var(--ink-dim); font: 700 9px/1.5 var(--mono); letter-spacing: 0.09em; text-transform: uppercase; text-align: center; }
  .picker-empty[hidden] { display: none; }
  .picker-footer { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .picker-footer span { color: var(--ink-dim); font: 600 8px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .picker-footer button {
    padding: 9px 18px; border: 1px solid var(--card-edge); border-radius: 999px;
    background: transparent; color: var(--ink); font: 600 10px/1 var(--mono);
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  }
  .picker-footer button:hover { border-color: rgba(241,238,246,0.4); }

  canvas#mini {
    position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20;
    width: 94px; height: 94px; image-rendering: crisp-edges; image-rendering: pixelated;
    border-radius: 14px; background: #2e2939;
    box-shadow: 0 14px 30px -10px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.09);
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  canvas#mini.show { opacity: 1; transform: none; }

  noscript p { text-align: center; color: var(--ink-dim); }
</style>
</head>

<a class="close" href="/fun" aria-label="Back to Shenanigans">×</a>
<main class="wrap">
  <header>
    <div class="eyebrow">Dead Pixels — Trait Bench <span class="led">●</span> <span id="unit">UNIT 0000</span></div>
    <h1>Ghostmaker</h1>

        <span class="mode-track" aria-hidden="true"><span class="mode-knob"></span></span>
        <span class="mode-label mode-neon">Neon</span>

    </div>
  </header>
  <div class="bench" id="bench">

          <div id="benchfx" aria-hidden="true"></div>
        </div>
        <div class="shadow"></div>
        <div class="mintbadge" id="mintbadge" aria-live="polite"></div>
        <div class="enter">
          <button class="xpost" id="btn-post-x" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
            <span>Post your entry</span>
          </button>
          <div class="xhint" id="xpost-hint" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="actions">
    <button class="primary" id="btn-random" disabled>Randomize all</button>
    <button id="btn-reset" disabled>Reset</button>
    <button id="btn-save" disabled>Download PNG</button>
    <button id="btn-save-nobg" disabled>PNG · no backdrop</button>
  </div>
</main>
<canvas id="mini" width="47" height="47" aria-hidden="true"></canvas>
<script src="/js/ghostmaker.js?v=24"></script>
