<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghostmaker · Dead Pixels</title>
<link rel="icon" type="image/png" href="/favicon.png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#272231">
<meta name="description" content="Assemble a Dead Pixels ghost from the real trait vault. The parts know the rules.">
<style>
  :root {
    color-scheme: dark;
    --led: #3BE8BC;
    --led-dim: rgba(59, 232, 188, 0.6);
    --ink: #F1EEF6;
    --ink-dim: rgba(241, 238, 246, 0.62);
    --ink-faint: rgba(241, 238, 246, 0.28);  /* decorative only — borders, glyphs */
    --card: rgba(255, 255, 255, 0.045);
    --card-edge: rgba(255, 255, 255, 0.11);
    --warn: #ffab84;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --gs: 7;                /* ghost pixel scale */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 0%, #2e2939 0%, #272231 52%, #211c2b 100%);
    color: var(--ink);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a.close { position: fixed; top: 18px; left: 20px; z-index: 30; color: rgba(241,238,246,0.5); text-decoration: none; font-size: 22px; font-weight: 300; line-height: 1; padding: 6px; }
  a.close:hover { color: var(--ink); }

  .wrap {
    max-width: 1080px; margin: 0 auto;
    padding: clamp(52px, 8vh, 92px) 28px 96px;
    display: flex; flex-direction: column; gap: clamp(36px, 5vh, 56px);
  }

  header { text-align: center; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink-dim); text-transform: uppercase; }
  .eyebrow .led { color: var(--led); }
  h1 { margin: 10px 0 0; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
  .tagline { margin: 10px 0 0; font-size: 15px; color: var(--ink-dim); line-height: 1.55; }

  /* ---------- the bench: ghost centered, part shelves either side ------- */
  .bench {
    position: relative;
    display: grid;
    /* the ghost track carries extra air on both sides of the canvas */
    grid-template-columns: minmax(170px, 1fr) 56px calc(47px * var(--gs) + 64px) 56px minmax(170px, 1fr);
    grid-auto-rows: 80px;
    column-gap: 26px;
    align-items: center;
    justify-items: center;
  }
  .r1 { grid-row: 1; } .r2 { grid-row: 2; } .r3 { grid-row: 3; } .r4 { grid-row: 4; }
  .r5 { grid-row: 5; } .r6 { grid-row: 6; } .r7 { grid-row: 7; } .r8 { grid-row: 8; }

  .ghostcol { grid-column: 3; grid-row: 1 / span 8; align-self: center; position: relative; z-index: 3; }
  .floatwrap { position: relative; width: calc(47px * var(--gs)); max-width: 100%; }
  .floater { position: relative; }
  canvas#ghost {
    display: block; width: 100%; aspect-ratio: 1;
    image-rendering: crisp-edges; image-rendering: pixelated;
    border-radius: 16px;
    box-shadow: 0 24px 48px -20px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .shadow {
    width: 40%; height: 12px; margin: 14px auto 0; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,0.32), transparent 70%);
  }
  .floater.pop { animation: pop 0.26s ease-out; }
  @keyframes pop { 0% { scale: 1; } 35% { scale: 1.03; } 100% { scale: 1; } }
  @media (prefers-reduced-motion: reduce) { .floater.pop { animation: none !important; } }

  /* row meta (left rail): trait name, current value, dice */
  .rowmeta {
    justify-self: end; text-align: right; min-width: 0; max-width: 100%;
    display: flex; align-items: center; gap: 7px;
    outline: none; border-radius: 10px; padding: 6px 4px 6px 8px;
  }
  .rowmeta .rowtext { margin-right: 3px; }
  .rowmeta:focus-visible { box-shadow: 0 0 0 2px var(--led-dim); }
  .rowtext { min-width: 0; }
  .rowname { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; color: var(--ink-dim); text-transform: uppercase; margin-bottom: 3px; }
  .rowval { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; color: var(--led); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dice, .browse {
    background: none; border: 1px solid var(--card-edge); border-radius: 9px;
    color: var(--ink-dim); font-size: 13px; line-height: 1; padding: 6px; cursor: pointer; flex: none;
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .dice:hover, .browse:hover { color: var(--led); border-color: var(--led-dim); }
  .dice:active { transform: rotate(72deg); }
  .browse { font-size: 14px; }
  .browse:active { transform: scale(0.92); }

  /* minted count (right rail) */
  .rowcount { justify-self: start; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; color: var(--ink-dim); text-transform: uppercase; white-space: nowrap; }

  /* part shelves: click the previous / next layer to put it on the ghost */
  .chip {
    width: 56px; height: 56px; padding: 5px; cursor: pointer;
    background: var(--card);
    border: 1px solid var(--card-edge); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 20px -14px rgba(0, 0, 0, 0.5);
    transition: border-color 0.16s ease, transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    touch-action: pan-y;
  }
  .chip:hover { border-color: var(--led-dim); background: rgba(255,255,255,0.075); transform: translateY(-2px); box-shadow: 0 14px 24px -14px rgba(0,0,0,0.55); }
  .chip:active { transform: scale(0.94); }
  .chip:focus-visible { box-shadow: 0 0 0 2px var(--led-dim); outline: none; }
  .chip canvas { width: 44px; height: 44px; image-rendering: crisp-edges; image-rendering: pixelated; pointer-events: none; }
  .chip .none { color: var(--ink-faint); font-size: 18px; font-weight: 200; pointer-events: none; }
  .chip:disabled { opacity: 0.25; cursor: default; }
  .chip:disabled:hover { border-color: var(--card-edge); transform: none; background: var(--card); }

  /* flying parts */
  #benchfx-back, #benchfx { position: absolute; inset: 0; pointer-events: none; }
  #benchfx-back { z-index: 1; }   /* backdrops fly under the ghost */
  #benchfx { z-index: 4; }
  .flypart {
    position: absolute; transform-origin: top left;
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
  .flypart.fly { transition: transform 0.34s cubic-bezier(0.2, 0.8, 0.3, 1.12), opacity 0.3s ease; }

  .log {
    min-height: 34px;
    display: flex; flex-direction: column; gap: 4px; align-items: center;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .log .line { color: var(--led); animation: fadeline 0.25s ease-out; }
  .log .line.warn { color: var(--warn); }
  .log .line.old { opacity: 0.35; }
  @keyframes fadeline { from { opacity: 0; transform: translateY(4px); } }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .actions button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    background: none; color: var(--ink); border: 1px solid var(--card-edge);
    border-radius: 999px; padding: 11px 22px; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .actions button:hover { border-color: rgba(241,238,246,0.4); }
  .actions button.primary { background: var(--ink); border-color: var(--ink); color: #272231; font-weight: 600; }
  .actions button.primary:hover { background: #ffffff; border-color: #ffffff; }
  .actions button:disabled { opacity: 0.35; cursor: default; }

  /* ---------- mobile: ghost on top, shelf rows beneath ------------------ */
  @media (max-width: 760px) {
    :root { --gs: 6; }
    .wrap { padding-left: 20px; padding-right: 20px; }
    .bench {
      grid-template-columns: 56px minmax(0, 1fr) 56px;
      grid-template-rows: auto;      /* row 1 fits the ghost */
      grid-auto-rows: 70px;
      column-gap: 12px;
    }
    .ghostcol { grid-column: 1 / -1; grid-row: 1; padding-bottom: 30px; }
    .bench .r1 { grid-row: 2; } .bench .r2 { grid-row: 3; } .bench .r3 { grid-row: 4; } .bench .r4 { grid-row: 5; }
    .bench .r5 { grid-row: 6; } .bench .r6 { grid-row: 7; } .bench .r7 { grid-row: 8; } .bench .r8 { grid-row: 9; }
    .chip-prev { grid-column: 1; }
    .rowmeta { grid-column: 2; justify-self: stretch; justify-content: center; text-align: center; }
    .chip-next { grid-column: 3; }
    .rowcount { display: none; }
  }
  @media (min-width: 761px) {
    .rowmeta { grid-column: 1; }
    .chip-prev { grid-column: 2; }
    .chip-next { grid-column: 4; }
    .rowcount { grid-column: 5; }
  }

  /* ---------- part browser (ported from /studio's trait picker) --------- */
  .picker-backdrop {
    position: fixed; inset: 0; z-index: 100;
    display: flex; justify-content: flex-end;
    background: rgba(10, 8, 15, 0.7);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .picker-sheet {
    width: min(680px, calc(100vw - 40px));
    height: 100vh; height: 100dvh;
    padding: 22px;
    overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain;
    border-left: 1px solid var(--card-edge);
    background:
      radial-gradient(circle at 85% 5%, rgba(177, 140, 255, 0.12), transparent 34%),
      #2b2636;
    box-shadow: -28px 0 70px rgba(0,0,0,0.52);
  }
  .picker-head {
    position: sticky; top: -22px; z-index: 5;
    min-height: 62px; margin: -22px -22px 16px; padding: 18px 22px 12px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(39, 34, 49, 0.94);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .picker-head .microlabel { display: block; font: 600 8px/1 var(--mono); letter-spacing: 0.12em; color: var(--ink-dim); text-transform: uppercase; }
  .picker-head h2 { margin: 4px 0 0; font-size: 22px; line-height: 1.1; font-weight: 600; }
  .picker-close {
    width: 36px; height: 36px; flex: none;
    border: 1px solid var(--card-edge); border-radius: 50%;
    background: rgba(255,255,255,0.05); color: var(--ink-dim);
    font-size: 22px; line-height: 1; cursor: pointer;
  }
  .picker-close:hover { background: rgba(255,255,255,0.1); color: var(--ink); }
  .gm-search-block {
    margin-bottom: 14px; padding: 10px;
    border: 1px solid rgba(59,232,188,0.22); border-radius: 12px;
    background: linear-gradient(135deg, rgba(59,232,188,0.055), rgba(177,140,255,0.045));
  }
  .trait-search > span { display: block; margin-bottom: 5px; color: var(--ink-dim); font: 600 8px/1 var(--mono); letter-spacing: 0.12em; }
  .trait-search input {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--card-edge); border-radius: 10px;
    background: rgba(0,0,0,0.14); color: var(--ink); font-size: 13px; outline: 0;
  }
  .trait-search input:focus { border-color: rgba(59,232,188,0.52); }
  .search-meta { min-height: 24px; margin-top: 6px; display: flex; align-items: center; gap: 7px; }
  .search-meta > span { flex: 1; color: var(--ink-dim); font: 650 8px/1.3 var(--mono); letter-spacing: 0.075em; text-transform: uppercase; }
  .search-meta button {
    flex: none; min-width: 44px; padding: 6px 9px;
    border: 1px solid rgba(255,255,255,0.09); border-radius: 999px;
    background: rgba(0,0,0,0.1); color: var(--ink-dim);
    font: 700 8px/1 var(--mono); letter-spacing: 0.07em; cursor: pointer;
  }
  .search-meta button:hover { border-color: rgba(59,232,188,0.42); color: var(--led); }
  .trait-browser-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 7px; }
  .trait-browser-grid > button {
    min-width: 0; min-height: 108px; padding: 8px 5px;
    border: 1px solid rgba(255,255,255,0.09); border-radius: 10px;
    background: rgba(0,0,0,0.12); color: var(--ink-dim); cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .trait-browser-grid > button:hover { transform: translateY(-1px); border-color: rgba(59,232,188,0.38); background: rgba(59,232,188,0.07); color: var(--ink); }
  .trait-browser-grid > button.current { border-color: var(--led); background: rgba(59,232,188,0.1); }
  .trait-preview { width: 58px; height: 58px; margin: 0 auto 5px; display: grid; place-items: center; border-radius: 8px; background: rgba(255,255,255,0.03); }
  .trait-preview img { width: 56px; height: 56px; object-fit: contain; image-rendering: crisp-edges; image-rendering: pixelated; }
  .trait-preview .none { color: var(--ink-faint); font-size: 20px; font-weight: 200; }
  .trait-browser-grid strong, .trait-browser-grid small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trait-browser-grid strong { color: var(--ink); font-size: 9.5px; line-height: 1.25; font-weight: 600; }
  .trait-browser-grid small { margin-top: 2px; color: var(--ink-dim); font: 600 7px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
  .picker-empty { min-height: 140px; display: flex; align-items: center; justify-content: center; color: var(--ink-dim); font: 700 9px/1.5 var(--mono); letter-spacing: 0.09em; text-transform: uppercase; text-align: center; }
  .picker-footer { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .picker-footer span { color: var(--ink-dim); font: 600 8px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .picker-footer button {
    padding: 9px 18px; border: 1px solid var(--card-edge); border-radius: 999px;
    background: transparent; color: var(--ink); font: 600 10px/1 var(--mono);
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  }
  .picker-footer button:hover { border-color: rgba(241,238,246,0.4); }

  canvas#mini {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    width: 94px; height: 94px; image-rendering: crisp-edges; image-rendering: pixelated;
    border-radius: 14px; background: #2e2939;
    box-shadow: 0 14px 30px -10px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.09);
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  canvas#mini.show { opacity: 1; transform: none; }

  noscript p { text-align: center; color: var(--ink-dim); }
</style>
</head>
<body>
<a class="close" href="/fun" aria-label="Back to Shenanigans">×</a>
<main class="wrap">
  <header>
    <div class="eyebrow">Dead Pixels — Trait Bench <span class="led">●</span> <span id="unit">UNIT 0000</span></div>
    <h1>Ghostmaker</h1>
    <p class="tagline">The ghost sits mid-assembly. Flick a shelf — parts fly on and off.</p>
    <noscript><p>Ghostmaker needs JavaScript — it runs entirely in your browser.</p></noscript>
  </header>
  <div class="bench" id="bench">
    <div id="benchfx-back" aria-hidden="true"></div>
    <div class="ghostcol">
      <div class="floatwrap">
        <div class="floater" id="floater">
          <canvas id="ghost" width="47" height="47" aria-label="Your assembled ghost"></canvas>
        </div>
        <div class="shadow"></div>
      </div>
    </div>
    <div id="benchfx" aria-hidden="true"></div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="actions">
    <button class="primary" id="btn-random">Randomize all</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-save">Download PNG</button>
    <button id="btn-save-nobg">PNG · no backdrop</button>
  </div>
</main>
<canvas id="mini" width="47" height="47" aria-hidden="true"></canvas>
<script src="/js/ghostmaker.js?v=11"></script>
</body>
</html>
